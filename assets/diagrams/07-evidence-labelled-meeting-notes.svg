<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Meeting notes before and after evidence labels</title><desc id="desc">A sentence becomes a more careful note with estimate, unknown and second-hand labels.</desc>
<style>:root{--ink:#183b56;--line:#607080;--panel:#f6f8fa;--amber:#fff0cc;--grey:#eef2f6;--blue:#dfeaf3}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--panel:#1f2937;--amber:#4a3610;--grey:#263444;--blue:#23364a}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:3;rx:16}.h{font-size:21px;font-weight:700}.note{font-size:20px}.tag{font-size:14px;font-weight:700}</style>
<text class="h" x="220" y="38" text-anchor="middle">Before</text><text class="h" x="670" y="38" text-anchor="middle">After</text><rect class="box" x="25" y="60" width="390" height="210" fill="var(--panel)"/><rect class="box" x="485" y="60" width="390" height="210" fill="var(--panel)"/>
<text class="note" x="58" y="132">We'll ship this by Friday, probably,</text><text class="note" x="58" y="162">once Dave checks the numbers.</text>
<text class="note" x="518" y="117">The team said</text><rect x="650" y="98" width="105" height="25" rx="12" fill="var(--blue)"/><text class="tag" x="702" y="115" text-anchor="middle">SECOND-HAND</text><text class="note" x="518" y="157">it may ship by Friday</text><rect x="735" y="138" width="78" height="25" rx="12" fill="var(--amber)"/><text class="tag" x="774" y="155" text-anchor="middle">ESTIMATE</text><text class="note" x="518" y="197">Dave checking the numbers is still</text><rect x="518" y="214" width="78" height="25" rx="12" fill="var(--grey)"/><text class="tag" x="557" y="231" text-anchor="middle">UNKNOWN</text>
</svg>
